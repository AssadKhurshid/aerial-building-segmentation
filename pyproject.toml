[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-building-segmentation"
version = "0.1.0"
description = "Building footprints from aerial imagery: U-Net segmentation, IoU on a held-out city, GeoJSON export"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
